[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitlater"
version = "1.0.0"
description = "Structured EDA system with CLI, API, and UI for data understanding before model building"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
  { name = "Jitesh Krishna", email = "jiteshkrishna6@gmail.com" }
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "colorama>=0.4.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[project.scripts]
fitlater = "fitlater.main:main"

[project.urls]
Homepage = "https://github.com/jitesh2511/FitLater"
Repository = "https://github.com/jitesh2511/FitLater"

[tool.setuptools.packages.find]
where = ["."]
include = ["fitlater*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]